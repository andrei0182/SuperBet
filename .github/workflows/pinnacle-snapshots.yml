name: Pinnacle snapshots (closing lines for value bets)

# One pinnapi.com request per snapshot (all prematch soccer odds at once). The last snapshot taken
# before each kick-off is that match's closing line, used to measure the value bets' closing EV.
# State lives on the `value-data` branch, not on main.
#
# Schedule and pinnapi budget (free tier: 100 requests per UTC day; our cap: 90, enforced in code
# from state/pinnapi_requests.csv):
#   - baseline every 2 hours, always fetches ............................ 12 requests/day
#   - every 15 minutes between 09:00 and 21:59 UTC (12:00-00:59 Romania in summer, 11:00-23:59
#     in winter), but only when a known match starts in the next 3 hours (otherwise the run
#     exits without a request) ....................................... at most 52 requests/day
#   - value-bets.yml daily run (1, plus 1 per manual run) ...................... ~1-2 requests/day
#   Worst case ~66/day, typically 40-55 (no matches in the next 3h -> no request).
# GitHub does not guarantee cron timing (runs can be late or dropped), so closing lines remain
# approximate; the dense window makes the last capture before kick-off much closer to the start.

permissions:
  contents: write  # push snapshots to the value-data branch

on:
  schedule:
    - cron: "15 */2 * * *"            # baseline (also catches early/late kick-offs outside the window)
    - cron: "5,20,35,50 9-21 * * *"   # dense, gated: only if a match starts within 3 hours
  workflow_dispatch: {}

concurrency:
  group: value-data  # shared with value-bets.yml: one writer to the state branch at a time
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
    steps:
      - name: Skip if the PINNAPI_KEY secret is not set
        if: env.PINNAPI_KEY == ''
        run: echo "::notice::PINNAPI_KEY secret missing -- add it in Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.PINNAPI_KEY != ''

      - name: Checkout state branch (value-data)
        if: env.PINNAPI_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin value-data >/dev/null; then
            git clone --depth 1 --branch value-data "$url" state
          else
            mkdir state && cd state && git init -q -b value-data && git remote add origin "$url"
          fi

      - uses: actions/setup-python@v5
        if: env.PINNAPI_KEY != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.PINNAPI_KEY != ''
        run: pip install -e .

      - name: Snapshot Pinnacle odds
        if: env.PINNAPI_KEY != ''
        env:
          # dense runs fetch only when a known match starts within 3 hours; baseline/manual runs always fetch
          GATE: ${{ github.event.schedule == '5,20,35,50 9-21 * * *' && '180' || '0' }}
        run: |
          superbet pinnacle-snapshot --out state/sharp.csv --history state/pinnacle_snapshots.csv \
            --only-if-kickoff-within "$GATE" --requests-log state/pinnapi_requests.csv --max-per-day 90

      - name: Commit state
        if: env.PINNAPI_KEY != ''
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." || git commit -q -m "Pinnacle snapshot $(date -u +%FT%H:%MZ)"
          git push -q origin value-data
