name: Daily 100% Over 2.5 recommendations

on:
  schedule:
    # 4:00 AM Romania time, year-round. Cron is always UTC with no DST
    # concept, so two entries cover both of Romania's UTC offsets — the
    # guard step below then skips whichever one does not actually land on
    # 4 AM local (handles the DST-switch week where both/neither would
    # otherwise be exactly right).
    - cron: "0 1 * * *"  # 4:00 Romania time when EEST (UTC+3, summer)
    - cron: "0 2 * * *"  # 4:00 Romania time when EET (UTC+2, winter)
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  send-recommendations:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless this is actually 4 AM Romania time
        run: |
          hour=$(TZ="Europe/Bucharest" date +%H)
          echo "Current Romania local hour: $hour"
          if [ "$hour" != "04" ]; then
            echo "Not 4 AM Romania time right now (this is the other cron entry, for the other DST offset) -- skipping the rest of the job."
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout SuperBet
        if: env.SKIP_RUN != 'true'
        uses: actions/checkout@v4
        with:
          path: SuperBet

      - name: Checkout BetExplorer
        if: env.SKIP_RUN != 'true'
        uses: actions/checkout@v4
        with:
          repository: andrei0182/bet
          ref: claude/trusting-ramanujan-2xdf01
          path: bet

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BetExplorer dependencies
        if: env.SKIP_RUN != 'true'
        working-directory: bet
        run: pip install -r requirements.txt

      - name: Install SuperBet dependencies
        if: env.SKIP_RUN != 'true'
        working-directory: SuperBet
        run: pip install -r requirements.txt

      - name: Compute today's date
        if: env.SKIP_RUN != 'true'
        id: date
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Run BetExplorer scraper (with stats)
        if: env.SKIP_RUN != 'true'
        working-directory: bet
        run: python main.py --date ${{ steps.date.outputs.value }} --with-stats

      - name: Run SuperBet scraper (all leagues)
        if: env.SKIP_RUN != 'true'
        working-directory: SuperBet
        run: python main.py --date ${{ steps.date.outputs.value }} --all --with-stats

      - name: Send recommendation email
        if: env.SKIP_RUN != 'true'
        working-directory: SuperBet
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python daily_recommendations.py \
            --bet-xlsx ../bet/output/matches.xlsx \
            --superbet-xlsx output/matches.xlsx \
            --date ${{ steps.date.outputs.value }}
